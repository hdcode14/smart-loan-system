{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 2rem auto; text-align: center;">
        <h2>Choose Registration Type</h2>
        <p>Select how you want to register with SmartLoan</p>
        
        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; flex-wrap: wrap;">
            <a href="{{ url_for('register_borrower') }}" class="btn btn-primary" style="min-width: 200px;">
                Register as Borrower
            </a>
            <a href="{{ url_for('register_admin') }}" class="btn btn-outline" style="min-width: 200px;">
                Register as Admin
            </a>
        </div>
        
        <p style="margin-top: 2rem;">
            Already have an account? <a href="{{ url_for('login') }}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
