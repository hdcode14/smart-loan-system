{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">Login to SmartLoan</h2>
        </div>
        
        <form method="POST">
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="user_type">Login As *</label>
                <select id="user_type" name="user_type" required>
                    <option value="borrower">Borrower</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
            <p>Don't have an account?</p>
            <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 1rem;">
                <a href="{{ url_for('register_borrower') }}" class="btn btn-outline">Register as Borrower</a>
                <a href="{{ url_for('register_admin') }}" class="btn btn-outline">Register as Admin</a>
            </div>
        </div>
        
        <div style="margin-top: 1.5rem; padding: 1rem; background-color: #f8fafc; border-radius: 0.375rem;">
            <h4 style="margin-bottom: 0.5rem;">Demo Accounts:</h4>
            <p><strong>Admin:</strong> admin@smartloan.com / admin123</p>
            <p><strong>Borrower:</strong> Register new account</p>
        </div>
    </div>
</div>
{% endblock %}
